                    <span style={{ fontSize: '0.72rem', fontWeight: 700, color: '#64748b' }}>02:00 PM</span>
                    <h4 style={{ fontSize: '1rem' }}>Jaipur Blue Pottery Master Artisan Workshop</h4>
                    <p style={{ fontSize: '0.82rem', color: '#64748b' }}>Shape ground quartz clay plates with master artisans without a potters wheel.</p>
                  </div>
                  <div>
                    <span style={{ fontSize: '0.72rem', fontWeight: 700, color: '#64748b' }}>06:30 PM</span>
                    <h4 style={{ fontSize: '1rem' }}>Sam Sand Dunes Desert Eco-Camp & Stargazing</h4>
                    <p style={{ fontSize: '0.82rem', color: '#64748b' }}>Swiss tents under Thar desert starlight with woodfire Dal Baati Churma feast.</p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* VIEW 3: GI CRAFTS MARKETPLACE */}
          {activeTab === 'crafts' && (
            <div className="main-wrap">
              <div style={{ marginBottom: '1.5rem' }}>
                <h2 style={{ fontSize: '1.6rem' }}>{t.giCraftsTitle}</h2>
                <p style={{ color: '#64748b', fontSize: '0.9rem' }}>{t.giCraftsSub}</p>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: '1.5rem' }}>
                {products.map(prod => (
                  <div key={prod.id} style={{ background: 'white', border: '1px solid #e2e8f0', borderRadius: 16, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
                    <div style={{ height: 180, background: '#f1f5f9' }}>
                      <img src={prod.image} alt={prod.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                    </div>
                    <div style={{ padding: '1rem', display: 'flex', flexDirection: 'column', flex: 1 }}>
                      <span style={{ fontSize: '0.72rem', fontWeight: 700, color: '#f97316', marginBottom: '0.25rem' }}>
                        <i data-lucide="sparkles" style={{ width: 12, height: 12, display: 'inline', marginRight: 4 }}></i>
                        {prod.maker}
                      </span>
                      <h4 style={{ fontSize: '0.95rem', marginBottom: '0.35rem' }}>{prod.name}</h4>
                      <p style={{ fontSize: '0.78rem', color: '#64748b', marginBottom: '0.75rem', flex: 1 }}>{prod.desc}</p>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '1px solid #f1f5f9', paddingTop: '0.75rem' }}>
                        <span style={{ fontSize: '1.15rem', fontWeight: 800, color: '#047857' }}>₹{prod.price.toLocaleString('en-IN')}</span>
                        <button className="btn-main btn-sm" onClick={() => addToCart(prod)}>
                          <i data-lucide="plus" style={{ width: 13, height: 13 }}></i> {t.addToCart}
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* VIEW 4: MY BOOKINGS & PASSES */}
          {activeTab === 'passes' && (
            <div className="main-wrap" style={{ maxWidth: 860 }}>
              <div style={{ marginBottom: '1.5rem' }}>
                <h2 style={{ fontSize: '1.6rem' }}>{t.myPasses}</h2>
                <p style={{ color: '#64748b', fontSize: '0.9rem' }}>{t.showPassNotice}</p>
              </div>

              {bookings.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '3rem', background: 'white', borderRadius: 16, border: '1px dashed #cbd5e1' }}>
                  <i data-lucide="ticket" style={{ width: 44, height: 44, color: '#94a3b8', marginBottom: '0.75rem' }}></i>
                  <h3>{t.noPassesYet}</h3>
                  <p style={{ color: '#64748b', fontSize: '0.85rem', marginTop: 4 }}>{t.noPassesSub}</p>
                </div>
              ) : (
                bookings.map(b => (
                  <div key={b.id} style={{ background: 'white', border: '1px solid #e2e8f0', borderRadius: 14, padding: '1.25rem', marginBottom: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.75rem' }}>
                    <div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.25rem' }}>
                        <span style={{ background: '#dcfce7', color: '#15803d', padding: '0.2rem 0.55rem', borderRadius: 9999, fontSize: '0.72rem', fontWeight: 700 }}>{b.status}</span>
                        <span style={{ fontFamily: 'monospace', fontWeight: 700, fontSize: '0.82rem', color: '#64748b' }}>{b.id}</span>
                      </div>
                      <h4 style={{ fontSize: '1.1rem' }}>{b.bizName}</h4>
                      <p style={{ fontSize: '0.82rem', color: '#64748b' }}>
                        {b.date} • {b.guests} {lang === 'hi' ? 'यात्री' : 'Travelers'} • <strong>₹{b.totalPrice.toLocaleString('en-IN')}</strong>
                      </p>
                    </div>
                    <button className="btn-main btn-sm" onClick={() => setActiveQRBooking(b)}>
                      <i data-lucide="qr-code" style={{ width: 14, height: 14 }}></i> {lang === 'hi' ? 'डिजिटल पास देखें' : 'View QR Pass'}
                    </button>
                  </div>
                ))
              )}
            </div>
          )}

          {/* MOBILE BOTTOM NAVIGATION BAR */}
          <div className="mobile-bottom-bar">
            <button className={`mobile-tab ${activeTab === 'explore' ? 'active' : ''}`} onClick={() => setActiveTab('explore')}>
              <i data-lucide="compass" style={{ width: 20, height: 20 }}></i>
              <span>{lang === 'hi' ? 'स्थल' : 'Places'}</span>
            </button>
            <button className={`mobile-tab ${activeTab === 'itinerary' ? 'active' : ''}`} onClick={() => setActiveTab('itinerary')}>
              <i data-lucide="calendar" style={{ width: 20, height: 20 }}></i>
              <span>{lang === 'hi' ? 'सर्किट' : 'Circuits'}</span>
            </button>
            <button className={`mobile-tab ${activeTab === 'crafts' ? 'active' : ''}`} onClick={() => setActiveTab('crafts')}>
              <i data-lucide="shopping-bag" style={{ width: 20, height: 20 }}></i>
              <span>{lang === 'hi' ? 'शिल्प' : 'Crafts'}</span>
            </button>
            <button className={`mobile-tab ${activeTab === 'passes' ? 'active' : ''}`} onClick={() => setActiveTab('passes')}>
              <i data-lucide="ticket" style={{ width: 20, height: 20 }}></i>
              <span>{lang === 'hi' ? 'पास' : 'Passes'}</span>
            </button>
            <button className="mobile-tab" onClick={() => setIsCartOpen(true)}>
              <i data-lucide="shopping-cart" style={{ width: 20, height: 20 }}></i>
              <span>{lang === 'hi' ? 'कार्ट' : 'Cart'} ({cart.reduce((s, i) => s + i.qty, 0)})</span>
            </button>
          </div>

          {/* BOOKING MODAL */}
          {selectedBiz && (
            <div className="modal-backdrop" onClick={() => setSelectedBiz(null)}>
              <div className="modal-window" onClick={e => e.stopPropagation()}>
                <div className="modal-top">
                  <h3>{t.reserveTitle}</h3>
                  <button onClick={() => setSelectedBiz(null)}><i data-lucide="x"></i></button>
                </div>
                <div className="modal-content">
                  <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center', background: '#f8fafc', padding: '0.75rem', borderRadius: 10, marginBottom: '1rem' }}>
                    <img src={selectedBiz.image} style={{ width: 60, height: 60, borderRadius: 8, objectFit: 'cover' }} />
                    <div>
                      <h4 style={{ fontSize: '0.95rem' }}>{selectedBiz.title}</h4>
                      <p style={{ fontSize: '0.8rem', color: '#047857', fontWeight: 700 }}>₹{selectedBiz.price.toLocaleString('en-IN')} / {selectedBiz.priceUnit}</p>
                    </div>
                  </div>

                  <form onSubmit={handleConfirmBooking}>
                    <div className="form-row">
                      <label>{lang === 'hi' ? 'पूरा नाम' : 'Full Name'}</label>
                      <input type="text" name="guestName" required placeholder="Your Name" />
                    </div>
                    <div className="form-row">
                      <label>{lang === 'hi' ? 'ईमेल पता' : 'Email Address'}</label>
                      <input type="email" name="guestEmail" required placeholder="name@domain.com" />
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' }}>
                      <div className="form-row">
                        <label>{t.travelDate}</label>
                        <input type="date" name="travelDate" required defaultValue={new Date(Date.now() + 86400000).toISOString().split('T')[0]} />
                      </div>
                      <div className="form-row">
                        <label>{t.travelers}</label>
                        <input type="number" name="guests" min="1" max="10" defaultValue="2" required />
                      </div>
                    </div>
                    <div className="form-row">
                      <label>{t.specialReqs}</label>
                      <textarea rows="2" placeholder="e.g. Vegetarian, early arrival..."></textarea>
                    </div>
                    <button type="submit" className="btn-main" style={{ width: '100%', justifyContent: 'center', padding: '0.75rem' }}>
                      <i data-lucide="check-circle" style={{ width: 16, height: 16 }}></i> {t.confirmPassBtn}
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* QR PASS MODAL */}
          {activeQRBooking && (
            <div className="modal-backdrop" onClick={() => setActiveQRBooking(null)}>
              <div className="modal-window" style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
                <div className="modal-top">
                  <h3>{t.digitalPassTitle}</h3>
                  <button onClick={() => setActiveQRBooking(null)}><i data-lucide="x"></i></button>
                </div>
                <div className="modal-content" style={{ textAlign: 'center' }}>
                  <div style={{ background: '#f8fafc', border: '2px dashed #059669', borderRadius: 16, padding: '1.5rem', marginBottom: '1rem' }}>
                    <div style={{ fontSize: '0.72rem', fontWeight: 700, textTransform: 'uppercase', color: '#059669' }}>
                      TourisMart India • Verified Pass
                    </div>
                    <h4 style={{ fontSize: '1.15rem', margin: '0.35rem 0' }}>{activeQRBooking.bizName}</h4>
                    <p style={{ fontSize: '0.8rem', color: '#64748b' }}>{activeQRBooking.guestName} • {activeQRBooking.guests} Travelers • {activeQRBooking.date}</p>
                    
                    <div id="reactQrCode" style={{ display: 'flex', justifyContent: 'center', margin: '1rem auto' }}></div>

                    <div style={{ background: '#f1f5f9', padding: '0.4rem 0.9rem', borderRadius: 9999, display: 'inline-block', fontFamily: 'monospace', fontWeight: 700 }}>
                      {activeQRBooking.id}
                    </div>
                    <p style={{ fontSize: '0.72rem', color: '#94a3b8', marginTop: '0.5rem' }}>{t.showPassNotice}</p>
                  </div>
                  <button className="btn-main" style={{ width: '100%', justifyContent: 'center' }} onClick={() => window.print()}>
                    <i data-lucide="printer" style={{ width: 16, height: 16 }}></i> {t.printPass}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CART SLIDE DRAWER */}
          {isCartOpen && (
            <div>
              <div className="cart-overlay" onClick={() => setIsCartOpen(false)}></div>
              <div className="cart-slider">
                <div style={{ padding: '1rem', borderBottom: '1px solid #e2e8f0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <h3 style={{ fontSize: '1.1rem', display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                    <i data-lucide="shopping-bag" style={{ width: 18, height: 18, color: '#f97316' }}></i> {t.cartTitle}
                  </h3>
                  <button onClick={() => setIsCartOpen(false)}><i data-lucide="x"></i></button>
                </div>
                <div style={{ flex: 1, overflowY: 'auto', padding: '1rem' }}>
                  {cart.length === 0 ? (
                    <p style={{ color: '#94a3b8', textAlign: 'center', marginTop: '2rem' }}>{t.cartEmpty}</p>
                  ) : (
                    cart.map(item => (
                      <div key={item.id} style={{ display: 'flex', gap: '0.75rem', alignItems: 'center', padding: '0.65rem 0', borderBottom: '1px solid #f1f5f9' }}>
                        <img src={item.image} style={{ width: 48, height: 48, borderRadius: 8, objectFit: 'cover' }} />
                        <div style={{ flex: 1 }}>
                          <h5 style={{ fontSize: '0.85rem' }}>{item.name}</h5>
                          <span style={{ fontSize: '0.78rem', color: '#047857', fontWeight: 700 }}>₹{item.price.toLocaleString('en-IN')}</span>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}>
                          <button className="btn-outline btn-sm" style={{ padding: '0.15rem 0.45rem' }} onClick={() => updateCartQty(item.id, -1)}>-</button>
                          <span style={{ fontWeight: 700, fontSize: '0.82rem' }}>{item.qty}</span>
                          <button className="btn-outline btn-sm" style={{ padding: '0.15rem 0.45rem' }} onClick={() => updateCartQty(item.id, 1)}>+</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
                <div style={{ padding: '1rem', borderTop: '1px solid #e2e8f0', background: '#f8fafc' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.75rem', fontWeight: 700 }}>
                    <span>Total:</span>
                    <span style={{ fontSize: '1.2rem', color: '#047857' }}>₹{cartTotal.toLocaleString('en-IN')}</span>
                  </div>
                  <button className="btn-main" style={{ width: '100%', justifyContent: 'center' }} onClick={() => { setCart([]); setIsCartOpen(false); showToast(lang === 'hi' ? 'ऑर्डर सफल! प्रत्यक्ष भुगतान कारीगरों को भेजा गया।' : 'Order confirmed! 100% direct payment channeled to artisans.'); }}>
                    <i data-lucide="credit-card" style={{ width: 16, height: 16 }}></i> {t.checkoutBtn}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* HOST ADD LISTING MODAL */}
          {isAddListingOpen && (
            <div className="modal-backdrop" onClick={() => setIsAddListingOpen(false)}>
              <div className="modal-window" onClick={e => e.stopPropagation()}>
                <div className="modal-top">
                  <h3>{t.addListingBtn}</h3>
                  <button onClick={() => setIsAddListingOpen(false)}><i data-lucide="x"></i></button>
                </div>
                <div className="modal-content">
                  <form onSubmit={async (e) => {
                    e.preventDefault();
                    const form = e.target;
                    const newPlace = {
                      id: `ind_${Date.now()}`,
                      title: form.title.value.trim(),
                      category: form.category.value,
                      region: form.region.value,
                      location: form.location.value.trim(),
                      price: parseFloat(form.price.value),
                      priceUnit: 'night',
                      rating: 5.0,
                      reviewsCount: 1,
                      image: form.image.value.trim() || 'https://images.unsplash.com/photo-1548013146-72479768bada?w=800&q=80',
                      ecoTag: 'Verified State Host',
                      description: form.desc.value.trim()
                    };

                    setPlaces(prev => [newPlace, ...prev]);
                    setIsAddListingOpen(false);

                    try {
                      await fetch('/api/places', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newPlace)
                      });
                    } catch(e) {}

                    showToast(lang === 'hi' ? 'नई भारतीय पेशकश प्रकाशित हुई!' : 'New Indian destination published!');
                  }}>
                    <div className="form-row">
                      <label>Title</label>
                      <input type="text" name="title" required placeholder="e.g. Heritage Haveli Stay & Kathakali" />
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' }}>
                      <div className="form-row">
                        <label>State</label>
                        <select name="region">
                          <option value="Rajasthan">Rajasthan</option>
                          <option value="Kerala">Kerala</option>
                          <option value="Himachal Pradesh">Himachal Pradesh</option>
                          <option value="Karnataka">Karnataka</option>
                          <option value="Goa">Goa</option>
                          <option value="Uttarakhand">Uttarakhand</option>
                        </select>
                      </div>
                      <div className="form-row">
                        <label>Category</label>
                        <select name="category">
                          <option value="stay">Heritage Stay</option>
                          <option value="tours">Heritage Walk</option>
                          <option value="food">Culinary Trail</option>
                          <option value="adventure">Trek / Safari</option>
                        </select>
                      </div>
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' }}>
                      <div className="form-row">
                        <label>Location</label>
                        <input type="text" name="location" required placeholder="City, State" />
                      </div>
                      <div className="form-row">
                        <label>Price (₹)</label>
                        <input type="number" name="price" required placeholder="3200" />
                      </div>
                    </div>
                    <div className="form-row">
                      <label>Photo URL</label>
                      <input type="url" name="image" placeholder="https://images.unsplash.com/..." />
                    </div>
                    <div className="form-row">
                      <label>Description</label>
                      <textarea name="desc" rows="3" required placeholder="Describe what authentic local experience travelers will enjoy..."></textarea>
                    </div>
                    <button type="submit" className="btn-main" style={{ width: '100%', justifyContent: 'center' }}>
                      <i data-lucide="check" style={{ width: 16, height: 16 }}></i> {t.addListingBtn}
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* TOAST PILL */}
          {toastMsg && (
            <div className="toast-pill">
              <i data-lucide="info" style={{ width: 16, height: 16 }}></i>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* FOOTER */}
          <footer className="app-footer">
            <div className="footer-inner">
              <div>
                <h4 style={{ color: 'white', marginBottom: '0.5rem' }}>TourisMart India</h4>
                <p style={{ lineHeight: 1.6, maxWidth: 360 }}>{t.footerDesc}</p>
              </div>
              <div>
                <h5 style={{ color: 'white', marginBottom: '0.5rem' }}>{lang === 'hi' ? 'प्रमुख राज्य' : 'Popular States'}</h5>
                <p style={{ color: '#94a3b8', lineHeight: 1.8 }}>Rajasthan • Kerala • Himachal Pradesh • Karnataka • Goa • Ladakh • Uttarakhand • West Bengal</p>
              </div>
              <div>
                <h5 style={{ color: 'white', marginBottom: '0.5rem' }}>{lang === 'hi' ? 'सुरक्षित नेटवर्क' : 'Security & Trust'}</h5>
                <p style={{ color: '#94a3b8', lineHeight: 1.8 }}>100% Direct Local Payments • Verified Community Hosts • Paperless Digital QR Passes</p>
              </div>
            </div>
            <div style={{ maxWidth: 1240, margin: '2rem auto 0', paddingTop: '1rem', borderTop: '1px solid rgba(255,255,255,0.1)', textAlign: 'center', fontSize: '0.78rem', color: '#64748b' }}>
              {t.footerBottom}
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
